<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="'PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fe0b0"/>
    </marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8fa697"/>
    </marker>
  </defs>

  <!-- 底 -->
  <rect width="1280" height="880" rx="18" fill="#0b1712"/>
  <text x="48" y="58" fill="#e9edc9" font-size="15" letter-spacing="6" font-family="monospace">MELU · SYSTEM MAP</text>
  <text x="48" y="84" fill="#8fa697" font-size="13">完整操作生態圈：瀏覽器 → Vercel（middleware＋API）→ 三個外部服務</text>

  <!-- ============ 使用者裝置 ============ -->
  <rect x="48" y="112" width="1184" height="200" rx="14" fill="none" stroke="#2b4436" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="68" y="140" fill="#7fe0b0" font-size="12" font-family="monospace" letter-spacing="3">USER DEVICE — 瀏覽器 / PWA</text>

  <rect x="68" y="156" width="330" height="132" rx="10" fill="#14231a" stroke="#2b4436"/>
  <text x="86" y="182" fill="#e8f0ea" font-size="14" font-weight="600">React 介面</text>
  <text x="86" y="205" fill="#8fa697" font-size="12">聊天 Chat · 黑膠播放器 · 播放佇列</text>
  <text x="86" y="224" fill="#8fa697" font-size="12">梅露（SVG＋rAF 行為狀態機）</text>
  <text x="86" y="243" fill="#8fa697" font-size="12">分層森林場景 · 日夜 theme token</text>
  <text x="86" y="270" fill="#57695b" font-size="11" font-family="monospace">app/companion · components/*</text>

  <rect x="428" y="156" width="300" height="132" rx="10" fill="#14231a" stroke="#2b4436"/>
  <text x="446" y="182" fill="#e8f0ea" font-size="14" font-weight="600">localStorage（local-first）</text>
  <text x="446" y="205" fill="#8fa697" font-size="12">喜歡 · 播放紀錄 · 訊號日誌 · 對話</text>
  <text x="446" y="224" fill="#8fa697" font-size="12">依 MELU ID 命名空間隔離</text>
  <text x="446" y="243" fill="#7fe0b0" font-size="12">先寫本機、離線可用，背景才上雲</text>

  <rect x="758" y="156" width="300" height="132" rx="10" fill="#14231a" stroke="#2b4436"/>
  <text x="776" y="182" fill="#e8f0ea" font-size="14" font-weight="600">MusicKit JS 播放器</text>
  <text x="776" y="205" fill="#8fa697" font-size="12">三層後援：完整播放（已授權）</text>
  <text x="776" y="224" fill="#8fa697" font-size="12">→ 30 秒試聽 → YouTube IFrame</text>
  <text x="776" y="252" fill="#57695b" font-size="11" font-family="monospace">lib/useMusicKit.js</text>

  <rect x="1088" y="156" width="124" height="132" rx="10" fill="#14231a" stroke="#2b4436"/>
  <text x="1150" y="182" fill="#e8f0ea" font-size="13" font-weight="600" text-anchor="middle">危機安全網</text>
  <text x="1150" y="205" fill="#8fa697" font-size="11" text-anchor="middle">客戶端關鍵詞</text>
  <text x="1150" y="222" fill="#8fa697" font-size="11" text-anchor="middle">正則（共用）</text>
  <text x="1150" y="252" fill="#57695b" font-size="10" text-anchor="middle" font-family="monospace">lib/crisis.js</text>

  <!-- 裝置 → Vercel -->
  <line x1="233" y1="312" x2="233" y2="376" stroke="#7fe0b0" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="245" y="350" fill="#7fe0b0" font-size="12">POST /api/*（訊息＋脈絡）</text>
  <line x1="908" y1="376" x2="908" y2="312" stroke="#8fa697" stroke-width="1.4" marker-end="url(#arrDim)"/>
  <text x="920" y="350" fill="#8fa697" font-size="12">回覆＋動作（排歌／歌單）</text>

  <!-- ============ Vercel ============ -->
  <rect x="48" y="376" width="1184" height="264" rx="14" fill="none" stroke="#2e7354" stroke-width="1.5"/>
  <text x="68" y="404" fill="#7fe0b0" font-size="12" font-family="monospace" letter-spacing="3">VERCEL — Next.js（App Router，前後端同一個 repo）</text>

  <rect x="68" y="420" width="200" height="196" rx="10" fill="#14231a" stroke="#2e7354"/>
  <text x="86" y="446" fill="#e8f0ea" font-size="14" font-weight="600">middleware</text>
  <text x="86" y="470" fill="#8fa697" font-size="12">① Origin 檢查</text>
  <text x="86" y="490" fill="#8fa697" font-size="12">② body ≤ 100KB</text>
  <text x="86" y="510" fill="#8fa697" font-size="12">③ 每 IP 限流</text>
  <text x="86" y="540" fill="#57695b" font-size="11">三關全過才進 API</text>
  <text x="86" y="600" fill="#57695b" font-size="11" font-family="monospace">middleware.js</text>

  <line x1="268" y1="500" x2="316" y2="500" stroke="#7fe0b0" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="316" y="420" width="392" height="196" rx="10" fill="#14231a" stroke="#2e7354"/>
  <text x="334" y="446" fill="#e8f0ea" font-size="14" font-weight="600">API Routes</text>
  <text x="334" y="472" fill="#e8f0ea" font-size="12" font-family="monospace">/api/companion</text>
  <text x="334" y="490" fill="#8fa697" font-size="11">陪伴對話：組 persona＋structured outputs＋兩段式選歌</text>
  <text x="334" y="514" fill="#e8f0ea" font-size="12" font-family="monospace">/api/song-story</text>
  <text x="334" y="532" fill="#8fa697" font-size="11">「認識這首歌」：web_search 查證後才說</text>
  <text x="334" y="556" fill="#e8f0ea" font-size="12" font-family="monospace">/api/musickit/token</text>
  <text x="334" y="574" fill="#8fa697" font-size="11">jose 簽 Apple 開發者權杖（私鑰只在伺服器）</text>
  <text x="334" y="600" fill="#57695b" font-size="11" font-family="monospace">app/api/*</text>

  <rect x="740" y="420" width="472" height="196" rx="10" fill="#14231a" stroke="#2e7354"/>
  <text x="758" y="446" fill="#e8f0ea" font-size="14" font-weight="600">伺服器函式庫（選歌與守衛的家）</text>
  <text x="758" y="472" fill="#8fa697" font-size="12">context 組裝：persona＋品味檔＋播放狀態 → system prompt</text>
  <text x="758" y="494" fill="#8fa697" font-size="12">appleMusic：searchCatalog / searchAlbumTracks / verifySelection</text>
  <text x="758" y="516" fill="#8fa697" font-size="12">歌手守衛 pickByArtist：指名歌手對不上寧可跳過</text>
  <text x="758" y="538" fill="#8fa697" font-size="12">opencc 簡→繁（詞典級；前端另有字元級防線）</text>
  <text x="758" y="560" fill="#8fa697" font-size="12">crisis 正則（與前端共用同一來源）</text>
  <text x="758" y="600" fill="#57695b" font-size="11" font-family="monospace">lib/*</text>

  <!-- Vercel → 外部 -->
  <line x1="400" y1="640" x2="330" y2="700" stroke="#7fe0b0" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="640" y1="640" x2="640" y2="700" stroke="#7fe0b0" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="880" y1="640" x2="950 " y2="700" stroke="#7fe0b0" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ 外部服務 ============ -->
  <rect x="48" y="700" width="368" height="140" rx="12" fill="#101d15" stroke="#2b4436"/>
  <text x="66" y="728" fill="#e9edc9" font-size="14" font-weight="600">Anthropic Claude API</text>
  <text x="66" y="752" fill="#8fa697" font-size="12">structured outputs：回覆鎖進 JSON schema</text>
  <text x="66" y="772" fill="#8fa697" font-size="12">web_search（≤1 次）：只查音樂事實</text>
  <text x="66" y="792" fill="#8fa697" font-size="12">對話摘要（歸檔標題）</text>
  <text x="66" y="820" fill="#57695b" font-size="11" font-family="monospace">claude-sonnet</text>

  <rect x="456" y="700" width="368" height="140" rx="12" fill="#101d15" stroke="#2b4436"/>
  <text x="474" y="728" fill="#e9edc9" font-size="14" font-weight="600">Apple Music API / MusicKit</text>
  <text x="474" y="752" fill="#8fa697" font-size="12">目錄查詢：候選曲全部真實存在</text>
  <text x="474" y="772" fill="#8fa697" font-size="12">專輯直查：排除單曲挑正式專輯</text>
  <text x="474" y="792" fill="#8fa697" font-size="12">全曲播放：使用者自己的訂閱授權</text>
  <text x="474" y="820" fill="#57695b" font-size="11" font-family="monospace">MusicKit JS · developer token</text>

  <rect x="864" y="700" width="368" height="140" rx="12" fill="#101d15" stroke="#2b4436"/>
  <text x="882" y="728" fill="#e9edc9" font-size="14" font-weight="600">Supabase（PostgreSQL）</text>
  <text x="882" y="752" fill="#8fa697" font-size="12">Row Level Security：資料庫層隔離每位使用者</text>
  <text x="882" y="772" fill="#8fa697" font-size="12">喜歡／播放紀錄／日誌／對話 雲端同步</text>
  <text x="882" y="792" fill="#8fa697" font-size="12">email OTP 綁定 → 跨裝置還原</text>
  <text x="882" y="820" fill="#57695b" font-size="11" font-family="monospace">local-first adapters ×3</text>

  <!-- localStorage ↔ Supabase 背景同步（右側大弧） -->
  <path d="M1058 288 C1180 380 1200 560 1120 700" fill="none" stroke="#8fa697" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrDim)"/>
  <text x="1146" y="480" fill="#8fa697" font-size="12" transform="rotate(63 1146 480)">背景同步（雙向）</text>

  <!-- 部署框注 -->
  <text x="48" y="866" fill="#57695b" font-size="12" font-family="monospace">DEPLOY：GitHub push → Vercel 自動建置部署 · melu-fm.com（Cloudflare DNS）· 守衛測試 ×81 通過才 commit</text>
</svg>
