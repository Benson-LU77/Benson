<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 440" width="1240" height="440" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fe0b0"/>
    </marker>
  </defs>
  <!-- 卡片底 -->
  <rect x="0" y="0" width="1240" height="440" rx="20" fill="#0e1a14"/>
  <rect x="0.5" y="0.5" width="1239" height="439" rx="20" fill="none" stroke="#25402f" stroke-width="1"/>
  <!-- 標題 -->
  <text x="32" y="46" fill="#e8f0ea" font-size="21" font-weight="600">兩段式選歌 · AI 永遠不會捏造歌曲</text>
  <text x="32" y="72" fill="#8fa697" font-size="14">Two-step song selection — the model can only pick from what Apple Music actually returns.</text>

  <!-- 5 個節點 -->
  <!-- node template: x, badge, title, two sublines -->
  <g>
    <!-- 1 -->
    <rect x="24" y="104" width="210" height="150" rx="14" fill="#16261d" stroke="#2e5e46" stroke-width="1.3"/>
    <circle cx="52" cy="134" r="13" fill="#173a2a"/>
    <text x="52" y="139" text-anchor="middle" fill="#7fe0b0" font-size="14" font-weight="700">1</text>
    <text x="42" y="182" fill="#e8f0ea" font-size="16.5" font-weight="600">使用者訊息</text>
    <text x="42" y="206" fill="#8fa697" font-size="13">聊當下的心情，</text>
    <text x="42" y="225" fill="#8fa697" font-size="13">例如「想聽點溫柔的」</text>
    <!-- 2 -->
    <rect x="266" y="104" width="210" height="150" rx="14" fill="#16261d" stroke="#2e5e46" stroke-width="1.3"/>
    <circle cx="294" cy="134" r="13" fill="#173a2a"/>
    <text x="294" y="139" text-anchor="middle" fill="#7fe0b0" font-size="14" font-weight="700">2</text>
    <text x="284" y="182" fill="#e8f0ea" font-size="16.5" font-weight="600">梅露 · 模型</text>
    <text x="284" y="206" fill="#8fa697" font-size="13">只提出「搜尋語」或專輯</text>
    <text x="284" y="225" fill="#8fa697" font-size="13">請求，<tspan fill="#cfe8db">不直接給歌</tspan></text>
    <!-- 3 -->
    <rect x="508" y="104" width="210" height="150" rx="14" fill="#16261d" stroke="#2e5e46" stroke-width="1.3"/>
    <circle cx="536" cy="134" r="13" fill="#173a2a"/>
    <text x="536" y="139" text-anchor="middle" fill="#7fe0b0" font-size="14" font-weight="700">3</text>
    <text x="526" y="182" fill="#e8f0ea" font-size="16.5" font-weight="600">伺服器查目錄</text>
    <text x="526" y="206" fill="#8fa697" font-size="13">用搜尋語問 Apple Music</text>
    <text x="526" y="225" fill="#8fa697" font-size="13">目錄，取回候選清單</text>
    <!-- 4 -->
    <rect x="750" y="104" width="210" height="150" rx="14" fill="#16261d" stroke="#2e5e46" stroke-width="1.3"/>
    <circle cx="778" cy="134" r="13" fill="#173a2a"/>
    <text x="778" y="139" text-anchor="middle" fill="#7fe0b0" font-size="14" font-weight="700">4</text>
    <text x="768" y="182" fill="#e8f0ea" font-size="16.5" font-weight="600">模型挑選</text>
    <text x="768" y="206" fill="#8fa697" font-size="13"><tspan fill="#cfe8db">只能</tspan>從候選 id 裡挑</text>
    <text x="768" y="225" fill="#8fa697" font-size="13">（enum 鎖死＋歌手守衛）</text>
    <!-- 5 -->
    <rect x="992" y="104" width="210" height="150" rx="14" fill="#16261d" stroke="#2e5e46" stroke-width="1.3"/>
    <circle cx="1020" cy="134" r="13" fill="#173a2a"/>
    <text x="1020" y="139" text-anchor="middle" fill="#7fe0b0" font-size="14" font-weight="700">5</text>
    <text x="1010" y="182" fill="#e8f0ea" font-size="16.5" font-weight="600">驗證 → 播放</text>
    <text x="1010" y="206" fill="#8fa697" font-size="13">二次驗證取權威曲目，</text>
    <text x="1010" y="225" fill="#8fa697" font-size="13">交給黑膠播放器</text>
  </g>

  <!-- 箭頭 -->
  <line x1="238" y1="179" x2="262" y2="179" stroke="#7fe0b0" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="480" y1="179" x2="504" y2="179" stroke="#7fe0b0" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="722" y1="179" x2="746" y2="179" stroke="#7fe0b0" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="964" y1="179" x2="988" y2="179" stroke="#7fe0b0" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 保證條 -->
  <rect x="24" y="300" width="1192" height="104" rx="14" fill="#12241a" stroke="#2e5e46" stroke-width="1.1"/>
  <circle cx="66" cy="352" r="18" fill="#173a2a"/>
  <path d="M66 342 l9 4 v6 c0 6 -4 10 -9 12 c-5 -2 -9 -6 -9 -12 v-6 z" fill="none" stroke="#7fe0b0" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="104" y="342" fill="#e8f0ea" font-size="16.5" font-weight="600">為什麼可信</text>
  <text x="104" y="368" fill="#a9c3b6" font-size="14">模型無法把任意字串當成歌曲輸出——它能碰到的，只有 Apple Music 回傳的<tspan fill="#7fe0b0" font-weight="600">真實候選</tspan>。</text>
  <text x="104" y="390" fill="#8fa697" font-size="13">同一套邏輯也用在「整份歌單」與「某專輯的歌」：歌單逐首驗歌手，專輯直接向 Apple 取正版曲目清單。</text>
</svg>
